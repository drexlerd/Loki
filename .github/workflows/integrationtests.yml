name: Integration Tests
on: [push, pull_request]


jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Loki
      uses: actions/checkout@v2

    - name: Configure, Build, and Install Dependencies
      run: |
        cd tests/integration/dependencies
        cmake -S . -B "$GITHUB_WORKSPACE/tests/integration/dependencies-build" -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/tests/integration/dependencies-install"
        cmake --build "$GITHUB_WORKSPACE/tests/integration/dependencies-build"

    - name: Build and Test Project
      run: |
        cd tests/integration
        cmake -S . -B build -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/tests/integration/dependencies-install"
        cmake --build build
