name: TestPyPI

on:
  push:
    branches:
      - test-pypi
  workflow_dispatch:
    inputs:
      version:
        description: "Staging version to build (e.g. 999.0.3)."
        required: true
      pyyggdrasil:
        description: "Staged pyyggdrasil version to pin (build dependency)."
        required: false
        default: ""

jobs:
  build_wheel_linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Stage TestPyPI version
        if: github.event_name == 'workflow_dispatch'
        uses: planning-and-learning/.github/actions/stage-version@main
        with:
          version: ${{ inputs.version }}
          pins: |
            pyyggdrasil=${{ inputs.pyyggdrasil }}
            yggdrasil=${{ inputs.pyyggdrasil }}

      - name: Install cibuildwheel
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir cibuildwheel

      - name: Build Linux wheel
        run: cibuildwheel --output-dir wheelhouse
        env:
          PIP_INDEX_URL: https://test.pypi.org/simple/
          PIP_EXTRA_INDEX_URL: https://pypi.org/simple/
          CIBW_PLATFORM: linux
          CIBW_BUILD: "cp310-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: x86_64
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT: "PYPDDL_JOBS=2 PIP_NO_CACHE_DIR=1 PIP_INDEX_URL=https://test.pypi.org/simple/ PIP_EXTRA_INDEX_URL=https://pypi.org/simple/"

      - name: Upload Linux wheel artifact
        uses: actions/upload-artifact@v5
        with:
          name: wheel-linux-cp310-x86_64
          path: wheelhouse/*.whl

  build_wheel_macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Stage TestPyPI version
        if: github.event_name == 'workflow_dispatch'
        uses: planning-and-learning/.github/actions/stage-version@main
        with:
          version: ${{ inputs.version }}
          pins: |
            pyyggdrasil=${{ inputs.pyyggdrasil }}
            yggdrasil=${{ inputs.pyyggdrasil }}

      - name: Install cibuildwheel
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir cibuildwheel

      - name: Build macOS wheel
        run: cibuildwheel --output-dir wheelhouse
        env:
          PIP_INDEX_URL: https://test.pypi.org/simple/
          PIP_EXTRA_INDEX_URL: https://pypi.org/simple/
          CIBW_PLATFORM: macos
          CIBW_BUILD: "cp310-*"
          CIBW_ARCHS: arm64
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT: "PYPDDL_JOBS=2 PIP_NO_CACHE_DIR=1 PIP_INDEX_URL=https://test.pypi.org/simple/ PIP_EXTRA_INDEX_URL=https://pypi.org/simple/"

      - name: Upload macOS wheel artifact
        uses: actions/upload-artifact@v5
        with:
          name: wheel-macos-cp310-arm64
          path: wheelhouse/*.whl

  publish:
    needs:
      - build_wheel_linux
      - build_wheel_macos
    runs-on: ubuntu-latest

    if: github.repository_owner == 'planning-and-learning'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Inspect distributions
        run: find dist -maxdepth 1 -type f

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
