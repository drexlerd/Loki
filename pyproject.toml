[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pyyggdrasil>=0.0.15,<0.1",
]
build-backend = "pypddl_build_backend"
backend-path = ["python"]

[project]
name = "pypddl"
version = "1.0.10"
description = "Python-distributed native package for the Loki PDDL parser library"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
authors = [
    {name = "Dominik Drexler", email = "dominik.drexler@liu.se"},
]
dependencies = [
    "pyyggdrasil>=0.0.15,<0.1",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/planning-and-learning/loki"

[tool.scikit-build]
build.targets = ["pypddl_wheel"]
cmake.build-type = "Release"
install.components = ["pypddl"]
wheel.packages = []

[tool.scikit-build.sdist]
include = [
    "CMakeLists.txt",
    "Config.cmake.in",
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "python/**",
    "cmake/**",
    "include/**",
    "src/**",
]
exclude = [
    "build*/**",
    "*.egg-info/**",
]

[tool.scikit-build.cmake.define]
LOKI_BUILD_PYPDDL = "ON"
LOKI_BUILD_TESTS = "OFF"
LOKI_BUILD_PROFILING = "OFF"
LOKI_BUILD_EXECUTABLES = "OFF"
CMAKE_INSTALL_LIBDIR = "lib"

[tool.cibuildwheel]
container-engine = "docker"
before-build = "python -m pip install --no-cache-dir 'pyyggdrasil>=0.0.15,<0.1'"

[tool.cibuildwheel.linux]
repair-wheel-command = "LD_LIBRARY_PATH=$(python -c 'import os, pyyggdrasil; print(os.pathsep.join(str(path) for path in sorted(pyyggdrasil.native_prefix().glob(\"lib*\")) if path.is_dir()))') auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
repair-wheel-command = "delocate-wheel --ignore-missing-dependencies --no-sanitize-rpaths --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
